<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BUMSA 26/27 Check-in</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f7f5;
      text-align: center;
      padding: 20px;
      margin: 0;
    }

    .container {
      max-width: 450px;
      margin: 25px auto;
      background: white;
      padding: 22px;
      border-radius: 12px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.1);
    }

    h2 { color: #176b45; }

    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border-radius: 7px;
      font-size: 16px;
    }

    input { border: 1px solid #ccc; }

    button {
      background: #176b45;
      color: white;
      border: none;
      cursor: pointer;
    }

    #reader { width: 100%; margin-top: 20px; }

    #status {
      margin-top: 18px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="container">
  <h2>BUMSA 26/27</h2>
  <h3>Freshers' Party Check-in</h3>

  <input type="password" id="pin"
         placeholder="Enter Executive PIN">

  <button id="startButton" onclick="startScanner()">
    START CAMERA SCANNER
  </button>

  <div id="reader"></div>

  <p id="status">Ready to scan.</p>
</div>

<script>

const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbxnYNUaWCQ3TO4NAA_Tz7xUiOBTP1BTW7sFaU-WqHdJM69oCMluAfFKXuMQ1QHq6TNt/exec";

const pinInput = document.getElementById("pin");

const savedPin = localStorage.getItem("BUMSA_EXECUTIVE_PIN");

if (savedPin) {
  pinInput.value = savedPin;
}

if (location.hash.startsWith("#pin=")) {
  const returnedPin = decodeURIComponent(
    location.hash.substring(5)
  );

  if (returnedPin) {
    localStorage.setItem("BUMSA_EXECUTIVE_PIN", returnedPin);
    pinInput.value = returnedPin;
    history.replaceState(null, "", location.pathname);
  }
}

let scanner = null;
let scanning = false;
let submitting = false;

function startScanner() {

  const pin = pinInput.value.trim();

  if (!pin) {
    document.getElementById("status").textContent =
      "Please enter the Executive PIN.";
    return;
  }

  if (scanning || submitting) return;

  localStorage.setItem("BUMSA_EXECUTIVE_PIN", pin);

  scanner = new Html5Qrcode("reader");

  document.getElementById("startButton").disabled = true;

  scanner.start(
    { facingMode: "environment" },
    { fps: 10, qrbox: { width: 230, height: 230 } },

    function(decodedText) {

      if (!scanning || submitting) return;

      scanning = false;
      submitting = true;

      document.getElementById("status").textContent =
        "QR detected. Processing check-in...";

      scanner.stop().then(() => {

        const form = document.createElement("form");

        form.method = "POST";
        form.action = SCRIPT_URL;

        const idField = document.createElement("input");
        idField.name = "registrationId";
        idField.value = decodedText;

        const pinField = document.createElement("input");
        pinField.name = "pin";
        pinField.value = pin;

        form.appendChild(idField);
        form.appendChild(pinField);

        document.body.appendChild(form);
        form.submit();

      }).catch(() => {
        submitting = false;
        document.getElementById("status").textContent =
          "Camera error. Please refresh and try again.";
        document.getElementById("startButton").disabled = false;
      });

    },

    function(error) {}

  ).then(() => {

    scanning = true;

    document.getElementById("status").textContent =
      "Camera active. Ready to scan.";

    document.getElementById("startButton").disabled = false;

  }).catch(() => {

    scanner = null;
    scanning = false;

    document.getElementById("status").textContent =
      "Camera could not start. Allow camera access.";

    document.getElementById("startButton").disabled = false;

  });
}

</script>
</body>
</html>
